{% include 'sparkfooter.html' %}

<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

<script>
    document.body.addEventListener('mysuccess', function(evt) {
    Toastify({
        text: "प्रोफाइल अपडेट हो गई भाई! ✅",
        duration: 3000,
        gravity: "top", 
        position: "right",
        backgroundColor: "linear-gradient(to right, #00b09b, #96c93d)",
    }).showToast();
});
</script>

<script>
    document.body.addEventListener('failed', function(evt) {
    Toastify({
        text: "Error happened",
        duration: 3000,
        gravity: "top", 
        position: "right",
        backgroundColor: "linear-gradient(to right, #00b09b, #96c93d)",
    }).showToast();
});
</script>

{% if messages %}
<ul class="messages">
    {% for message in messages %}
        {% if message.tags %}
    <script>
Toastify({
  text: " {{ message }}",
  duration: 3000,
  destination: "https://github.com/apvarun/toastify-js",
  newWindow: true,
  close: true,
  gravity: "top", // `top` or `bottom`
  position: "right", // `left`, `center` or `right`
  stopOnFocus: true, // Prevents dismissing of toast on hover
  style: {
    background: "linear-gradient(to right, #00b09b, #96c93d)",
  },
  onClick: function(){} // Callback after click
}).showToast();
    </script>
    {% endif %}
    {% endfor %}
</ul>
{% endif %}

<!-- Include Choices JavaScript (latest) -->
<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
<!-- Or versioned -->
<script src="https://cdn.jsdelivr.net/npm/choices.js@11.1.0/public/assets/scripts/choices.min.js"></script>
<script>
    function initCategoryChoices() {
        const element1 = document.getElementById('id_book');
        if (!element1) return;
        new Choices(element1, {
            searchEnabled: true
        });
    }
    document.addEventListener('DOMContentLoaded', initCategoryChoices);
    document.body.addEventListener('htmx:afterSwap', initCategoryChoices);
</script>
