ID: {{ form.instance.id }}
<div id="jobform" hx-on::after-request="document.getElementById('jobform').innerHTML=''">
<form method="POST" 
     hx-post="{% url 'accounts:saveschool' %}"
     hx-target="#job-{{ form.instance.id }}"
     hx-on::before-request="for (instance in CKEDITOR.instances) { CKEDITOR.instances[instance].updateElement(); }"
     hx-swap="outerHTML"
     hx-indicator="#spinner"
     hx-on::after-request="this.reset()"
	 enctype="multipart/form-data">

	{% include 'partials/spinner.html' %}

		{% csrf_token %}

        {{ form.media }}

                    <div class="row gy-2">
                                    {% for field in form %} 
                                    <div class="col-md-4">
                                        {{ field.errors }}
                                        <div class="mb-3">
                                            <label class="form-label">  {{ field.label_tag }} <span
                                                    class="text-danger">*</span></label>
                                            {{ field }}
                                        </div>
                                    </div>
                                    {% endfor %}
                        <!-- Django form fields -->
                        <div class="col-12">
                        </div>

                    </div>

		<div class="col">
			<button type="submit" class="btn btn-primary btn-round">Subscribe</button>
		</div>
	
</form>
</div>
