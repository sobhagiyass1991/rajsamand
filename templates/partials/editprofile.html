{% load static %}

<!-- Settings Content -->
<div class="col-xl-9 col-lg-8">
    <div class="card settings mb-0" id="editprofile">

        <div class="card-header">
            <h6>Settings</h6>
        </div>

        <div class="card-body pb-3">

            <div class="settings-link d-flex align-items-center flex-wrap">
                <a href="profile-settings.html" class="active ps-3">
                    <i class="isax isax-user-octagon me-2"></i>Profile Settings
                </a>
                <a href="security-settings.html">
                    <i class="isax isax-shield-tick me-2"></i>Security
                </a>
                <a href="notification-settings.html">
                    <i class="isax isax-notification me-2"></i>Notifications
                </a>
                <a href="integration-settings.html" class="pe-3">
                    <i class="isax isax-hierarchy me-2"></i>Integrations
                </a>
            </div>

            <!-- FORM START -->
            <form method="POST"
                  hx-post="{% url 'accounts:editprofile' %}"
                  hx-target="#myprofile"
                  hx-indicator="#spinner"
                  enctype="multipart/form-data">

                {% csrf_token %}
                {% include 'partials/spinner.html' %}

                <div class="settings-content mb-3">
                    <h6 class="fs-16 mb-3">Basic Information</h6>

                    <div class="row gy-2">

                        <div class="col-lg-12">
                            <div class="d-flex align-items-center">

                                <img src="{% static 'assets/img/users/user-01.jpg' %}"
                                     alt="image"
                                     class="img-fluid avatar avatar-xxl br-10 flex-shrink-0 me-3">

                                <div>
                                    <p class="fs-14 text-gray-6 fw-normal mb-2">
                                        Recommended dimensions are typically 400 x 400 pixels.
                                    </p>

                                    <div class="d-flex align-items-center">
                                        <div class="me-2">
                                            <label class="upload-btn" for="fileUpload">Upload</label>
                                            <input type="file" id="fileUpload" name="profile_image" hidden>
                                        </div>

                                        <a href="#" class="btn btn-light btn-md">Remove</a>
                                    </div>
                                </div>

                            </div>
                        </div>

                        <!-- Django form fields -->
                        <div class="col-12">
                            {{ form.as_p }}
                        </div>

                    </div>
                </div>

                <!-- FOOTER BUTTONS (inside form) -->
                <div class="card-footer">
                    <div class="d-flex align-items-center justify-content-end">

                        <a href="javascript:void(0);" class="btn btn-light me-2">
                            Cancel
                        </a>

                        <button type="submit" class="btn btn-lg btn-primary">
                            Save
                        </button>

                    </div>
                </div>

            </form>
            <!-- FORM END -->

        </div>
    </div>
</div>
