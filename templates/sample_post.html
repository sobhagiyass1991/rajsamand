<!-- jQuery (सबसे पहले) -->
<script src="https://code.jquery.com"></script>
<!-- Toastr JS (दूसरे नंबर पर) 
 <script src="https://cdnjs.cloudflare.com"></script>
<script type="text/javascript" src="{% static 'assets/src/toastify.js' %}"></script>
-->


<script>
  document.body.addEventListener('success', function (evt) {
      console.log("Success event triggered!");    
      // सुधार: i और bgColors को डिफाइन किया गया है ताकि एरर न आए
      Toastify({
        text: "Successfully submitted", // हिंदी संदेश
        duration: 3000,
        close: true,
        gravity: "top", // top or bottom
        position: "right", // left, center or right
        style: {
          background: "linear-gradient(to right, #FF8C00, #FFD700)", // राजस्थानी ग्रेडिएंट
        }
      }).showToast();
    
  });
</script>
<script>
  document.body.addEventListener('failed', function (evt) {
      console.log("Success event triggered!");    
      // सुधार: i और bgColors को डिफाइन किया गया है ताकि एरर न आए
      Toastify({
        text: " ohh You have an Error.", // हिंदी संदेश
        duration: 3000,
        close: true,
        gravity: "top", // top or bottom
        position: "right", // left, center or right
        style: {
          background: "linear-gradient(to right, #FF8C00, #FFD700)", // राजस्थानी ग्रेडिएंट
        }
      }).showToast();
    
  });
</script>
